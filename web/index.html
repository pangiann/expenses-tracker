<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/quick-add.css">
  <link rel="stylesheet" href="styles/summary-cards.css">
  <link rel="stylesheet" href="styles/charts.css">
  <link rel="stylesheet" href="styles/category-cards.css">
  <link rel="stylesheet" href="styles/recurring-costs.css">
  <link rel="stylesheet" href="styles/add-month-dialog.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<!--
  Display text comes from web/i18n/<language>.json. Elements name their string id:
  data-i18n (text), data-i18n-placeholder, data-i18n-title, data-i18n-aria-label.
-->
<body>
  <header class="top-bar">
    <div class="brand"><img src="assets/icon.svg" alt="" class="brand-icon"> <span data-i18n="app.title"></span></div>
    <nav class="month-navigation">
      <button id="previousMonthButton" class="round-button" data-i18n-title="nav.previousMonth" disabled>‹</button>
      <h1 id="monthTitle" data-i18n="app.loading"></h1>
      <button id="nextMonthButton" class="round-button" data-i18n-title="nav.nextMonth" disabled>›</button>
      <button id="addMonthButton" class="round-button add-month-button" data-i18n-title="nav.addMonth">+</button>
    </nav>
    <div class="top-bar-actions">
      <span id="saveStatus" class="save-status"></span>
      <select id="languageSelect" class="language-select" data-i18n-aria-label="language.label"></select>
      <button id="exportButton" class="secondary-button" data-i18n="backup.export" data-i18n-title="backup.exportHint"></button>
      <button id="importButton" class="secondary-button" data-i18n="backup.import" data-i18n-title="backup.importHint"></button>
      <input id="importFileInput" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <div id="errorBanner" class="error-banner" hidden></div>

  <main class="page-content">
    <section class="card quick-add">
      <h2 data-i18n="quickAdd.title"></h2>
      <form id="quickAddForm" class="quick-add-form" autocomplete="off">
        <input id="quickAddAmount" type="number" step="0.01" min="0" data-i18n-placeholder="common.amountPlaceholder" required>
        <input id="quickAddDescription" type="text" data-i18n-placeholder="common.descriptionPlaceholder">
        <select id="quickAddCategory" required></select>
        <input id="quickAddDate" type="date">
        <button type="submit" class="primary-button" data-i18n="common.add"></button>
      </form>
    </section>

    <section class="summary-cards">
      <div class="card summary-card">
        <div class="summary-card-label" data-i18n="summary.earned"></div>
        <div class="summary-card-value" id="totalIncomeValue"></div>
        <div class="summary-card-detail"><span data-i18n="summary.expected"></span> <span id="expectedIncomeSlot"></span></div>
      </div>
      <div class="card summary-card">
        <div class="summary-card-label" data-i18n="summary.spent"></div>
        <div class="summary-card-value" id="totalSpentValue"></div>
        <div class="summary-card-detail"><span data-i18n="summary.budgeted"></span> <span id="totalBudgetedValue"></span></div>
      </div>
      <div class="card summary-card">
        <div class="summary-card-label" data-i18n="summary.saved"></div>
        <div class="summary-card-value" id="savedValue"></div>
        <div class="summary-card-detail"><span data-i18n="summary.expected"></span> <span id="expectedSavingsValue"></span></div>
      </div>
      <div class="card summary-card">
        <div class="summary-card-label" data-i18n="summary.savingsRate"></div>
        <div class="summary-card-value" id="savingsRateValue"></div>
        <div class="summary-card-detail"><span data-i18n="summary.variableSpending"></span> <span id="variableSpendingValue"></span></div>
      </div>
    </section>

    <section class="charts">
      <div class="card">
        <h2 data-i18n="charts.budgetVsActual"></h2>
        <div id="budgetBars" class="budget-bars"></div>
      </div>
      <div class="card">
        <h2 data-i18n="charts.whereMoneyWent"></h2>
        <div class="spending-donut">
          <svg id="spendingDonutChart" viewBox="0 0 120 120" class="spending-donut-chart"></svg>
          <ul id="spendingDonutLegend" class="spending-donut-legend"></ul>
        </div>
      </div>
    </section>

    <section class="month-details">
      <div id="categoryCards" class="category-cards"></div>
      <div class="side-column">
        <section class="card category-card income-card">
          <div class="category-card-header income-card-header">
            <div class="category-card-title">
              <h2 data-i18n="income.title"></h2>
              <span id="incomeTotal" class="category-card-spent"></span>
            </div>
          </div>
          <ul id="incomeList" class="expense-list"></ul>
          <form id="incomeAddForm" class="category-add-form" autocomplete="off">
            <input name="description" data-i18n-placeholder="income.descriptionPlaceholder">
            <input name="amount" type="number" step="0.01" min="0" placeholder="€" required>
            <button type="submit" data-i18n-title="common.add">+</button>
          </form>
        </section>

        <aside id="recurringCostsPanel" class="card recurring-costs-panel">
          <h2 data-i18n="recurring.fixedCosts"></h2>
          <ul id="fixedCostsList" class="recurring-cost-list"></ul>
          <h3 data-i18n="recurring.subscriptions"></h3>
          <ul id="subscriptionsList" class="recurring-cost-list"></ul>
          <div class="recurring-costs-total"><span data-i18n="recurring.total"></span> <span id="recurringCostsTotal"></span></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="addMonthDialog" class="dialog-backdrop" hidden>
    <form id="addMonthForm" class="card dialog">
      <h2 data-i18n="addMonth.title"></h2>
      <div class="dialog-fields">
        <select id="addMonthMonthSelect"></select>
        <input id="addMonthYearInput" type="number" min="1900" max="2999">
      </div>
      <p class="dialog-hint" data-i18n="addMonth.hint"></p>
      <p id="addMonthError" class="dialog-error"></p>
      <div class="dialog-actions">
        <button type="button" id="addMonthCancelButton" class="secondary-button" data-i18n="addMonth.cancel"></button>
        <button type="submit" class="primary-button" data-i18n="addMonth.submit"></button>
      </div>
    </form>
  </div>

  <!-- Built from web/scripts/ by `npm run build` (esbuild); see README "Build". -->
  <script type="module" src="dist/main.js"></script>
</body>
</html>
