<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#3a3fc4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#141a3a" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Rounded tile on the macOS icon grid (824 x 824 inside a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- Donut chart: circumference of r=230 is 1445.1; segments match the app's category colors -->
  <g transform="rotate(-90 512 512)" fill="none" stroke-width="92">
    <circle cx="512" cy="512" r="230" stroke="#ffffff" opacity=".18"/>
    <circle cx="512" cy="512" r="230" stroke="#22c08a" stroke-dasharray="404 1041.1" stroke-dashoffset="0"/>
    <circle cx="512" cy="512" r="230" stroke="#ff6f9c" stroke-dasharray="289 1156.1" stroke-dashoffset="-412"/>
    <circle cx="512" cy="512" r="230" stroke="#ffb547" stroke-dasharray="246 1199.1" stroke-dashoffset="-709"/>
    <circle cx="512" cy="512" r="230" stroke="#3fd0e6" stroke-dasharray="217 1228.1" stroke-dashoffset="-963"/>
    <circle cx="512" cy="512" r="230" stroke="#b98cff" stroke-dasharray="249 1196.1" stroke-dashoffset="-1188"/>
  </g>

  <!-- Euro sign -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="40">
    <path d="M590 438 A100 100 0 1 0 590 586"/>
    <path d="M410 485 H540 M410 539 H530"/>
  </g>
</svg>
